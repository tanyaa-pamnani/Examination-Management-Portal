<!DOCTYPE html>
<html>

<head>
    <title>EMP Login</title>
</head>

<body>

    <h1>Examination Management Portal</h1>

    <h2>Login</h2>

    {% with messages = get_flashed_messages(with_categories=true) %}
    {% for category, message in messages %}
    <p>{{ message }}</p>
    {% endfor %}
    {% endwith %}

    <form method="POST">

        <label>Email:</label>
        <input type="email" name="email" required>

        <br><br>

        <label>Password:</label>
        <input type="password" name="password" required>

        <br><br>

        <button type="submit">Login</button>

    </form>

    <p>New student?</p>

    <a href="{{ url_for('student_register') }}">
        Register here
    </a>

    <p>Are you an examiner?</p>

    <a href="{{ url_for('examiner_register') }}">
        Register as Examiner
    </a>

</body>

</html>
