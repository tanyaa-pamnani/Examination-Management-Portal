<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Booking Window Settings</title>
<style>
body{font-family:Arial,sans-serif;margin:28px;color:#222;max-width:850px}
h1{color:#173b63}.panel{border:1px solid #ccc;border-radius:8px;padding:20px}
label{display:block;margin-top:15px;font-weight:bold}
input{padding:9px;width:min(100%,360px);box-sizing:border-box;margin-top:5px}
button{padding:10px 18px;margin-top:20px;cursor:pointer}
.notice{background:#eef4fa;padding:12px;border-radius:6px;margin:12px 0}
</style>
</head>
<body>
<h1>Admin Booking Window Management</h1>
<p><a href="{{ url_for('admin_dashboard') }}">← Back to Admin Dashboard</a></p>
{% with messages = get_flashed_messages(with_categories=true) %}
  {% for category, message in messages %}<div class="notice">{{ message }}</div>{% endfor %}
{% endwith %}
<div class="panel">
<form method="POST">
<label>
<input type="checkbox" name="booking_enabled" value="yes" {% if booking_enabled %}checked{% endif %}>
 Allow students to book examination slots
</label>
<label for="booking_opens_at">Booking opens at (optional)</label>
<input type="datetime-local" id="booking_opens_at" name="booking_opens_at" value="{{ booking_opens_at }}">
<label for="booking_closes_at">Booking closes at (optional)</label>
<input type="datetime-local" id="booking_closes_at" name="booking_closes_at" value="{{ booking_closes_at }}">
<p>Leave both dates blank if booking should remain open whenever the checkbox is enabled.</p>
<label for="cancellation_hours">Cancellation closes this many hours before the slot</label>
<input type="number" id="cancellation_hours" name="cancellation_hours" min="0" max="720" value="{{ cancellation_hours }}" required>
<button type="submit">Save Booking Settings</button>
</form>
</div>
</body>
</html>
