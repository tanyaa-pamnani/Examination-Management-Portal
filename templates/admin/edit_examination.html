<!DOCTYPE html>
<html>

<head>
    <title>Edit Examination</title>
</head>

<body>

    <h1>Edit Examination</h1>

    {% with messages = get_flashed_messages(with_categories=true) %}
    {% for category, message in messages %}
    <p>{{ message }}</p>
    {% endfor %}
    {% endwith %}

    <form method="POST">

        <label>Examination Name:</label>
        <input type="text" name="exam_name" value="{{ examination.exam_name }}" required>

        <br><br>

        <label>Select Course:</label>
        <select name="course_id" required>
            {% for course in courses %}
            <option value="{{ course.id }}" {% if course.id==examination.course_id %}selected{% endif %}>
                {{ course.course_code }} - {{ course.course_name }}
            </option>
            {% endfor %}
        </select>

        <br><br>

        <label>Examination Date:</label>
        <input type="date" name="exam_date" value="{{ examination.exam_date }}" required>

        <br><br>

        <label>Duration (minutes):</label>
        <input type="number" name="duration" min="1" value="{{ examination.duration }}" required>

        <br><br>

        <label>Maximum Marks:</label>
        <input type="number" name="max_marks" min="1" value="{{ examination.max_marks }}" required>

        <br><br>

        <label>Description:</label>
        <textarea name="description">{{ examination.description }}</textarea>

        <br><br>

        <button type="submit">Save Changes</button>

    </form>

    <br>

    <a href="{{ url_for('view_examinations') }}">Back to Examinations</a>

</body>

</html>
